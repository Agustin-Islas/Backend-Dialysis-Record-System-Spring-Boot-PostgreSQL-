spring.application.name=backend-dialysis-record
spring.config.import=optional:file:.env[.properties]
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

security.jwt.secret=${JWT_SECRET}
security.jwt.access-minutes=30
security.jwt.refresh-days=14
security.jwt.refresh-bytes=64
security.jwt.issuer=dialysis-record
