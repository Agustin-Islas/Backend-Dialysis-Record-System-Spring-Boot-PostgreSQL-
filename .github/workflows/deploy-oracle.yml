name: Deploy Backend to Oracle VM

on:
  push:
    branches:
      - main
    paths:
      - "backend-dialysis-record/**"
      - "deploy/oracle/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-oracle.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

          ssh-keyscan -p "${ORACLE_PORT:-22}" -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/oracle_key -p "${ORACLE_PORT:-22}" "$ORACLE_USER@$ORACLE_HOST" \
            "cd '$ORACLE_APP_DIR' && APP_DIR='$ORACLE_APP_DIR' bash deploy/oracle/deploy.sh"
